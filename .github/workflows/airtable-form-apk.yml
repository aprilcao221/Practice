name: Build Airtable Form APK

on:
  push:
    paths:
      - 'AirtableForm/**'
      - '.github/workflows/airtable-form-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AirtableForm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk AirtableForm.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirtableForm-apk
          path: AirtableForm/AirtableForm.apk

      # A release gives a direct download link you can open on the phone.
      - name: Publish APK to the "airtable-form-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: airtable-form-latest
          name: Airtable Form (latest build)
          body: |
            Latest APK built from `${{ github.ref_name }}` (${{ github.sha }}), build ${{ github.run_number }}.
            Download **AirtableForm.apk** on your Android phone and open it to install.
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: AirtableForm/AirtableForm.apk
